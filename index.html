<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090711">
  <meta name="description" content="My personal bio page">
  <title>prey — bio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <div class="noise"></div>

  <main class="page">
    <section class="card" id="profileCard">
      <div class="avatar-wrap">
        <img id="avatar" class="avatar" src="assets/avatar.jpg" alt="Profile picture"
             onerror="this.src='https://placehold.co/180x180/171321/e95bb5?text=♡'">
        <span class="online-dot"></span>
      </div>

      <h1 id="name">yourname</h1>
      <p id="username">@yourname</p>

      <div class="badges">
        <span>✦ creator</span>
        <span>♡ online</span>
      </div>

      <p class="bio" id="bio">
        welcome to my little corner of the internet ♡
      </p>

      <div class="links" id="links"></div>

      <div class="music">
        <button class="music-btn" id="musicBtn" aria-label="Play music">▶</button>
        <div class="music-info">
          <strong id="songTitle">your song</strong>
          <span id="songArtist">your artist</span>
        </div>
        <div class="bars" id="bars" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>

      <div class="views">♡ <span id="views">000000</span> views</div>
    </section>

    <footer>
      <span>made with ♡</span>
      <span>•</span>
      <span id="year"></span>
    </footer>
  </main>

  <audio id="audio" preload="metadata" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
